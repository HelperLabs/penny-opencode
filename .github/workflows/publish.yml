name: Publish npm adapter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'HelperLabs/penny-opencode'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - run: npm install -g npm@11.18.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: node node_modules/opencode-ai/postinstall.mjs
      - run: node scripts/verify-host.mjs --host
      - run: |
          node scripts/dependency-manifest.mjs release-dependencies.json "$GITHUB_REF_NAME"
          node scripts/dependency-manifest.mjs .live/dependencies-repeat.json "$GITHUB_REF_NAME"
          cmp release-dependencies.json .live/dependencies-repeat.json
          npm pack --json > .live/pack.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dependencies-${{ github.sha }}
          path: |
            release-dependencies.json
            .live/pack.json
            *.tgz
          retention-days: 90
          if-no-files-found: error
      - name: Publish with npm OIDC
        run: npm publish ./mypenny-opencode-*.tgz --access public --provenance
